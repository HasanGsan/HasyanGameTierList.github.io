<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACCESS CONTROL // AUTH REQUIRED</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        
        .login-box {
            max-width: 500px;
            width: 100%;
            padding: 40px;
            border: 3px solid var(--border-color);
            background: var(--bg-panel);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.3);
            position: relative;
        }
        
        .login-title {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--primary-color);
        }
        
        .login-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 0.9rem;
        }
        
        .access-denied {
            color: var(--danger-color);
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
            display: none;
            animation: blink 0.5s ease-in-out 3;
        }
        
        .login-hint {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--text-dim);
            color: var(--text-dim);
            font-size: 0.8rem;
            text-align: center;
        }
        
        .decrypting {
            display: none;
            text-align: center;
            color: var(--primary-color);
            margin-top: 15px;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--text-dim);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="matrixRain"></canvas>
    <div class="scanlines"></div>
    <div class="crt-overlay"></div>
    <div class="vignette"></div>
    
    <div class="container">
        <header class="terminal-header admin-header">
            <span class="hud-corner hud-tl"></span>
            <span class="hud-corner hud-tr"></span>
            <span class="hud-corner hud-bl"></span>
            <span class="hud-corner hud-br"></span>
            <div class="header-line">
                <span class="blink">█</span> SECURE ACCESS CONTROL v3.14.2
            </div>
            <div class="header-subline">
                <span class="status-dot status-dot-danger"></span>[SYSTEM STATUS: LOCKED] [ENCRYPTION: AES-256] [AUTH REQUIRED]
            </div>
        </header>

        <div class="login-container">
            <div class="login-box">
                <span class="hud-corner hud-tl"></span>
                <span class="hud-corner hud-tr"></span>
                <span class="hud-corner hud-bl"></span>
                <span class="hud-corner hud-br"></span>
                <div class="login-title">
                    ACCESS RESTRICTED
                </div>
                <div class="login-subtitle">
                    ENTER PASSPHRASE TO DECRYPT ADMIN PANEL
                </div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label>PASSPHRASE:</label>
                        <input 
                            type="password" 
                            id="passphrase" 
                            class="terminal-input" 
                            placeholder="Enter your passphrase..."
                            autocomplete="off"
                            autofocus
                        >
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary btn-large" style="width: 100%;">
                            <span class="btn-icon">🔓</span> DECRYPT & ACCESS
                        </button>
                    </div>
                    
                    <div class="access-denied" id="accessDenied">
                        ⚠ ACCESS DENIED - INVALID PASSPHRASE
                    </div>
                    
                    <div class="decrypting" id="decrypting">
                        <div class="spinner"></div>
                        <div style="margin-top: 10px;">DECRYPTING DATA...</div>
                    </div>
                </form>
                
                <div class="login-hint">
                    This panel is encrypted with AES-256.<br>
                    Without the correct passphrase, access is impossible.
                </div>
            </div>
        </div>
    </div>

    <!-- CryptoJS library для шифрования -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="encrypted_admin.js"></script>
    <script>
        const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        (function initMatrixRain() {
            if (REDUCED_MOTION) return;
            const canvas = document.getElementById('matrixRain');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const chars = 'アイウエオカキクケコサシスセソタチツテト0123456789ABCDEF#$%&';
            let columns, drops, fontSize = window.innerWidth < 600 ? 22 : 16;
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                columns = Math.ceil(canvas.width / fontSize);
                drops = new Array(columns).fill(0).map(() => Math.random() * -50);
            }
            resize();
            window.addEventListener('resize', resize);
            function draw() {
                ctx.fillStyle = 'rgba(10, 14, 10, 0.08)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.font = `${fontSize}px "Share Tech Mono", monospace`;
                for (let i = 0; i < columns; i++) {
                    const char = chars.charAt(Math.floor(Math.random() * chars.length));
                    const y = drops[i] * fontSize;
                    ctx.fillStyle = 'rgba(0, 255, 65, 0.4)';
                    ctx.fillText(char, i * fontSize, y);
                    if (y > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                }
            }
            setInterval(draw, 55);
        })();

        (function initAmbientGlitch() {
            if (REDUCED_MOTION) return;
            const trigger = () => {
                document.body.classList.add('glitch-pulse');
                setTimeout(() => document.body.classList.remove('glitch-pulse'), 180);
                setTimeout(trigger, 6000 + Math.random() * 9000);
            };
            setTimeout(trigger, 4000 + Math.random() * 4000);
        })();
    </script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const passphrase = document.getElementById('passphrase').value;
            const accessDenied = document.getElementById('accessDenied');
            const decryptingEl = document.getElementById('decrypting');
            
            accessDenied.style.display = 'none';
            decryptingEl.style.display = 'block';
            
            await new Promise(resolve => setTimeout(resolve, 500));
            
            try {
                const decrypted = CryptoJS.AES.decrypt(ENCRYPTED_ADMIN_DATA, passphrase);
                const decryptedStr = decrypted.toString(CryptoJS.enc.Utf8);
                
                if (!decryptedStr) {
                    throw new Error('Invalid passphrase');
                }
                
                sessionStorage.setItem('admin_authenticated', 'true');
                sessionStorage.setItem('admin_session_key', passphrase);
                
                const baseHref = new URL('.', window.location.href).href;
                let htmlWithBase = /<head[^>]*>/i.test(decryptedStr)
                    ? decryptedStr.replace(/<head[^>]*>/i, (match) => `${match}<base href="${baseHref}">`)
                    : `<head><base href="${baseHref}"></head>${decryptedStr}`;
                
                try {
                    const cssResp = await fetch(baseHref + 'style.css');
                    if (cssResp.ok) {
                        const cssText = await cssResp.text();
                        htmlWithBase = htmlWithBase.replace(
                            '<link rel="stylesheet" href="style.css">',
                            `<style>${cssText}</style>`
                        );
                    }
                } catch {}
                
                try {
                    const jsResp = await fetch(baseHref + 'editor.js');
                    if (jsResp.ok) {
                        const jsText = await jsResp.text();
                        const safeJs = jsText.replace(/<\/script>/gi, '</scr' + 'ipt>');
                        const openIdx = htmlWithBase.indexOf('<script src="editor.js">');
                        const marker = 'editor.js"></' + 'script>';
                        if (openIdx !== -1) {
                            const closeIdx = htmlWithBase.indexOf(marker, openIdx);
                            if (closeIdx !== -1) {
                                const before = htmlWithBase.slice(0, openIdx);
                                const after = htmlWithBase.slice(closeIdx + marker.length);
                                htmlWithBase = before + '<scr' + 'ipt>' + safeJs + '</scr' + 'ipt>' + after;
                            }
                        }
                    }
                } catch {}
                
                const blob = new Blob([htmlWithBase], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                window.location.href = url;
                
            } catch (error) {
                decryptingEl.style.display = 'none';
                accessDenied.style.display = 'block';
                document.getElementById('passphrase').value = '';
                document.getElementById('passphrase').focus();
            }
        });
        
        window.addEventListener('load', () => {
            const title = document.querySelector('.login-title');
            const text = title.textContent;
            title.textContent = '';
            
            let i = 0;
            const interval = setInterval(() => {
                if (i < text.length) {
                    title.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(interval);
                }
            }, 50);
        });
    </script>
</body>
</html>
